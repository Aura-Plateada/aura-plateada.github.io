    <!-- Script para renderizar galerías por época -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

                renderPersonajesGallery('galeria-epoca-vigilantes', ['vigilantes', 'sac']);
                
                // Renderizar galería para el Ciclo de la Violencia
                renderPersonajesGallery('galeria-epoca-cv', ['cv']);
                
                // Renderizar galería para otra época
                // Ajusta las categorías según necesites

            }
